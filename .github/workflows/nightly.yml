name: nightly
# DESIGN.md §11: property tests with 10× the cases, and an audit of the dependencies that ship.
# CodeQL runs through GitHub's default setup, so it is not repeated here.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nightly
  cancel-in-progress: false
jobs:
  property:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: supabase/postgres:17.11.0.003
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      PROPERTY_RUNS_FACTOR: "10"
      DATABASE_URL_MIGRATIONS: postgres://postgres:postgres@localhost:54322/postgres
      DASH_SOURCE_URL: postgres://dash_reader:password@localhost:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: psql "$DATABASE_URL_MIGRATIONS" -v ON_ERROR_STOP=1 -f db/local-roles.sql
      - run: pnpm db:migrate
      - run: pnpm test:integration
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      # Production dependencies only: the dev-only vercel CLI bundles advisories without fixes.
      - run: pnpm audit --prod --audit-level high
