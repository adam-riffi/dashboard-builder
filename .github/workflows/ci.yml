name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: supabase/postgres:17.11.0.003
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["54322:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL_MIGRATIONS: postgres://postgres:postgres@localhost:54322/postgres
      DASH_SOURCE_URL: postgres://dash_reader:password@localhost:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: psql "$DATABASE_URL_MIGRATIONS" -v ON_ERROR_STOP=1 -f db/local-roles.sql
      # Migrate first: the gateway suite introspects dash_demo while the db suite runs.
      - run: pnpm db:migrate
      - run: pnpm test:integration
  e2e:
    # Pinned: the screenshot baselines depend on this image's fonts (ADR 0008).
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      DATABASE_URL_MIGRATIONS: postgres://postgres:postgres@localhost:54322/postgres
      DASH_SOURCE_URL: postgres://dash_reader:password@localhost:54322/postgres
      DASH_APP_DATABASE_URL: postgres://dash_app:password@localhost:54322/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # A throwaway ES256 key, so local Auth signs tokens the way the hosted project does.
      # With signing_keys_path configured, the CLI adds the key to that file, which must exist.
      - run: echo "[]" > supabase/signing_keys.json && pnpm exec supabase gen signing-key --algorithm ES256 > /dev/null
      # Auth (anonymous sign-in) and Postgres only.
      - run: >-
          pnpm exec supabase start -x
          studio,imgproxy,storage-api,realtime,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit,postgrest
      - name: Export Supabase settings
        run: |
          eval "$(pnpm exec supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${PUBLISHABLE_KEY:-$ANON_KEY}" >> "$GITHUB_ENV"
          echo "DASH_JWKS_URL=$API_URL/auth/v1/.well-known/jwks.json" >> "$GITHUB_ENV"
          echo "DASH_JWT_ISSUER=$API_URL/auth/v1" >> "$GITHUB_ENV"
          # Fail fast if Auth fell back to HS256: the gateway only verifies through the JWKS.
          curl -sf "$API_URL/auth/v1/.well-known/jwks.json" | jq -e '.keys[] | select(.alg == "ES256")' > /dev/null
      - run: pnpm db:migrate
      # Demo data for the query smoke test.
      - run: pnpm db:seed
      - run: pnpm --filter @dash/demo exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: apps/demo/test-results
          retention-days: 7
      # New or missing visual baselines are written here; commit them from this artifact (ADR 0008).
      - if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-baselines
          path: apps/demo/e2e/__screenshots__
          if-no-files-found: ignore
          retention-days: 7
